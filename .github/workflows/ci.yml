# Integración continua: tipos, lint, pruebas y compilación en cada push y pull
# request. Solo comprueba: la web la publica solis por su cuenta
# (scripts/solis-servidor.sh).
name: CI

on:
  push:
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src --ext .ts,.tsx
      - run: npm test
      # La misma compilación que hace solis (modo servidor, subcarpeta /quality).
      # Un segundo intento si falla: Next descarga las fuentes al compilar y un
      # corte momentáneo de red no debe dar la comprobación por fallida.
      - name: Compilar como solis
        env:
          PAGES_BASE_PATH: /quality
          NEXT_PUBLIC_SITE_URL: https://solis.usal.es/quality
          NEXT_PUBLIC_PUBLICACION: solis
        run: npx next build || (sleep 20 && npx next build)
